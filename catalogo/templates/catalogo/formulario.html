<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if producto %}Editar Producto{% else %}Agregar Producto{% endif %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0 rounded-3">
                    <!-- Encabezado de la tarjeta -->
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="card-title mb-0 text-center fw-bold">
                            {% if producto %}Editar Producto{% else %}Agregar Nuevo Producto{% endif %}
                        </h4>
                    </div>

                    <!-- Cuerpo del formulario -->
                    <div class="card-body p-4">
                        <form method="POST">
                            {% csrf_token %}

                            <!-- Nombre -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Nombre del producto</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" 
                                       value="{{ producto.nombre|default:'' }}" placeholder="Ej: Taladro Inalámbrico 18V" required>
                            </div>

                            <!-- Descripción -->
                            <div class="mb-3">
                                <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" rows="3" 
                                          placeholder="Detalla las características del producto..." required>{{ producto.descripcion|default:'' }}</textarea>
                            </div>

                            <div class="row">
                                <!-- Precio -->
                                <div class="col-md-6 mb-3">
                                    <label for="precio" class="form-label fw-semibold">Precio ($)</label>
                                    <div class="input-group">
                                        <span class="input-group-text">$</span>
                                        <input type="number" step="0.01" class="form-control" id="precio" name="precio" 
                                               value="{{ producto.precio|default:'' }}" placeholder="0.00" required>
                                    </div>
                                </div>

                                <!-- Stock -->
                                <div class="col-md-6 mb-3">
                                    <label for="stock" class="form-label fw-semibold">Stock disponible</label>
                                    <input type="number" class="form-control" id="stock" name="stock" 
                                           value="{{ producto.stock|default:'' }}" placeholder="0" required>
                                </div>
                            </div>

                            <!-- Imagen -->
                            <div class="mb-3">
                                <label for="imagen" class="form-label fw-semibold">Imagen (URL)</label>
                                <input type="url" class="form-control" id="imagen" name="imagen"
                                       value="{{ producto.imagen|default:'' }}" placeholder="https://ejemplo.com/imagen.jpg">
                                <div class="form-text">Opcional. Pega el link directo a una imagen del producto.</div>
                            </div>

                            <!-- Botones de acción -->
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">
                                    {% if producto %}Guardar Cambios{% else %}Guardar Producto{% endif %}
                                </button>
                                <a href="{% url 'lista_productos' %}" class="btn btn-outline-secondary">
                                    Cancelar y Volver
                                </a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
